name: build-seedump

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译 arm64 iOS 命令行工具
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios14.0 \
                -isysroot "$SDK" \
                -O2 -Wall -Wextra \
                -o seedump seedump.c
          file seedump
          ls -l seedump

      - name: 用 ldid 签名（带上 task_for_pid-allow）
        run: |
          brew install ldid || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sents.plist seedump
            echo "signed ok"
            ldid -e seedump || true
          else
            echo "!! ldid 不可用，产物未签名"
            exit 1
          fi
          file seedump

      - name: 打包 deb（rootless + rootful 各一个）
        run: |
          chmod +x makedeb.sh
          ./makedeb.sh iphoneos-arm64 seedump seedump_rootless.deb
          ./makedeb.sh iphoneos-arm   seedump seedump_rootful.deb
          ls -l *.deb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: seedump-debs
          path: |
            seedump
            ents.plist
            seedump_rootless.deb
            seedump_rootful.deb
          if-no-files-found: error
